<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-ptheme="github">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 编辑器</title>

<!-- CodeMirror 5 (编辑器，本地 vendor/) -->
<link rel="stylesheet" href="vendor/codemirror.min.css">
<!-- highlight.js 主题（亮/暗，本地 vendor/) -->
<link id="hljs-light" rel="stylesheet" href="vendor/hljs-github.min.css">
<link id="hljs-dark" rel="stylesheet" href="vendor/hljs-github-dark.min.css" disabled>
<!-- GitHub Markdown 渲染样式（含亮/暗两套，按 data-color-mode 切换，本地 vendor/) -->
<link rel="stylesheet" href="vendor/github-markdown.css">

<style>
  :root{
    --bg:#ffffff; --fg:#1f2328; --muted:#57606a;
    --panel:#f6f8fa; --border:#d0d7de; --accent:#0969da;
    --btn-bg:#f6f8fa; --btn-hover:#eaeef2;
  }
  [data-theme="dark"]{
    --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e;
    --panel:#161b22; --border:#30363d; --accent:#2f81f7;
    --btn-bg:#21262d; --btn-hover:#30363d;
  }

  /* ===== 预览渲染主题（浅色 + 深色设计感） =====
     默认 = GitHub 风格；其余主题通过 [data-ptheme] 覆盖。
     这些变量独立于 app 的明暗主题，预览卡片配色完全由渲染主题决定。 */
  :root{
    --card:#ffffff; --card-bg:#f2f4f7; --card-border:#e1e4e8;
    --code-bg:#f6f8fa; --quote-bg:#f6f8fa; --table-head:#f6f8fa;
    --ptheme-fg:#1f2328; --ptheme-muted:#57606a; --ptheme-link:#0969da;
    --ptheme-accent:#0969da; --ptheme-quote-border:#d0d7de;
    --preview-font-size:14px; --preview-max-width:880px;
  }
  [data-ptheme="newspaper"]{
    --card:#fdfaf3; --card-bg:#eceae0; --card-border:#e3d9c0;
    --code-bg:#f3ecdb; --quote-bg:#f7f1e3; --table-head:#f1e8d4;
    --ptheme-fg:#3a3226; --ptheme-muted:#7a6f5d; --ptheme-link:#9a6b2f;
    --ptheme-accent:#9a6b2f; --ptheme-quote-border:#c9b079;
  }
  [data-ptheme="mint"]{
    --card:#f6fbf8; --card-bg:#e8f4ee; --card-border:#cfe8db;
    --code-bg:#eef7f1; --quote-bg:#eef7f1; --table-head:#eef7f1;
    --ptheme-fg:#1f3a30; --ptheme-muted:#5b7a6e; --ptheme-link:#0f8a5f;
    --ptheme-accent:#15a06b; --ptheme-quote-border:#9fd3bb;
  }
  [data-ptheme="lavender"]{
    --card:#fbf9fe; --card-bg:#eee9f7; --card-border:#ddd3ef;
    --code-bg:#f3eefb; --quote-bg:#f3eefb; --table-head:#f3eefb;
    --ptheme-fg:#2e2640; --ptheme-muted:#6b5f86; --ptheme-link:#6d42c9;
    --ptheme-accent:#7c3aed; --ptheme-quote-border:#c4b3ec;
  }
  [data-ptheme="blossom"]{
    --card:
      radial-gradient(circle at 16% 20%, #fff2f8 0%, rgba(255,242,248,0) 44%),
      radial-gradient(circle at 72% 60%, #fff0f7 0%, rgba(255,240,247,0) 48%),
      radial-gradient(circle at 50% 44%, #fff8fc 0%, rgba(255,248,252,0) 60%),
      radial-gradient(circle at 84% 16%, #f6f1ff 0%, rgba(246,241,255,0) 44%),
      radial-gradient(circle at 90% 86%, #f1fbf3 0%, rgba(241,251,243,0) 28%),
      radial-gradient(circle at 16% 72%, #fff8ed 0%, rgba(237,241,255,0) 20%),
      #fffafd;
    --card-bg: #fdf6fb;
    --card-border: #f0e2ec;
    --code-bg: #eef8f0;
    --quote-bg: #fbf3f9;
    --table-head: #fbf3f9;
    --ptheme-fg: #6f6470;
    --ptheme-muted: #b3a4b0;
    --ptheme-link: #cf6fa6;
    --ptheme-accent: #e888b8;
    --ptheme-quote-border: #e6d3e6;
    --preview-font-size:14px; --preview-max-width:880px;
  }

  /* 深色渲染主题 */
  [data-ptheme="github-dark"]{
    --card:#161b22; --card-bg:#0d1117; --card-border:#30363d;
    --code-bg:#0d1117; --quote-bg:#161b22; --table-head:#161b22;
    --ptheme-fg:#e6edf3; --ptheme-muted:#8b949e; --ptheme-link:#58a6ff;
    --ptheme-accent:#58a6ff; --ptheme-quote-border:#30363d;
  }
  [data-ptheme="dracula"]{
    --card:#282a36; --card-bg:#21222c; --card-border:#44475a;
    --code-bg:#282a36; --quote-bg:#282a36; --table-head:#282a36;
    --ptheme-fg:#f8f8f2; --ptheme-muted:#6272a4; --ptheme-link:#8be9fd;
    --ptheme-accent:#bd93f9; --ptheme-quote-border:#6272a4;
  }
  /* 深色主题下表格斑马纹改为白色微透叠加（原浅灰叠加在暗底上不可见） */
  [data-ptheme="github-dark"] .markdown-body tbody tr:nth-child(2n),
  [data-ptheme="dracula"] .markdown-body tbody tr:nth-child(2n){ background:rgba(255,255,255,.04); }

  /* Dracula 代码高亮配色覆盖（基础结构复用 vendor 的 hljs-github-dark，仅改 token 色） */
  [data-ptheme="dracula"] .markdown-body .hljs{ color:#f8f8f2; }
  [data-ptheme="dracula"] .markdown-body .hljs-comment,
  [data-ptheme="dracula"] .markdown-body .hljs-quote{ color:#6272a4; font-style:italic; }
  [data-ptheme="dracula"] .markdown-body .hljs-keyword,
  [data-ptheme="dracula"] .markdown-body .hljs-selector-tag,
  [data-ptheme="dracula"] .markdown-body .hljs-literal,
  [data-ptheme="dracula"] .markdown-body .hljs-section,
  [data-ptheme="dracula"] .markdown-body .hljs-link{ color:#ff79c6; }
  [data-ptheme="dracula"] .markdown-body .hljs-string,
  [data-ptheme="dracula"] .markdown-body .hljs-regexp{ color:#f1fa8c; }
  [data-ptheme="dracula"] .markdown-body .hljs-number,
  [data-ptheme="dracula"] .markdown-body .hljs-built_in,
  [data-ptheme="dracula"] .markdown-body .hljs-type,
  [data-ptheme="dracula"] .markdown-body .hljs-class .hljs-title,
  [data-ptheme="dracula"] .markdown-body .hljs-params{ color:#bd93f9; }
  [data-ptheme="dracula"] .markdown-body .hljs-title,
  [data-ptheme="dracula"] .markdown-body .hljs-function .hljs-title,
  [data-ptheme="dracula"] .markdown-body .hljs-attr,
  [data-ptheme="dracula"] .markdown-body .hljs-attribute,
  [data-ptheme="dracula"] .markdown-body .hljs-property,
  [data-ptheme="dracula"] .markdown-body .hljs-symbol,
  [data-ptheme="dracula"] .markdown-body .hljs-tag,
  [data-ptheme="dracula"] .markdown-body .hljs-name,
  [data-ptheme="dracula"] .markdown-body .hljs-meta{ color:#50fa7b; }
  [data-ptheme="dracula"] .markdown-body .hljs-variable,
  [data-ptheme="dracula"] .markdown-body .hljs-template-variable{ color:#f8f8f2; }
  [data-ptheme="dracula"] .markdown-body .hljs-addition{ color:#50fa7b; }
  [data-ptheme="dracula"] .markdown-body .hljs-deletion{ color:#ff5555; }
  [data-ptheme="dracula"] .markdown-body .hljs-emphasis{ font-style:italic; }
  [data-ptheme="dracula"] .markdown-body .hljs-strong{ font-weight:700; }

  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--fg);
  }
  .app{display:flex; flex-direction:column; height:100vh; overflow:hidden;}

  .toolbar{
    display:flex; gap:2px; align-items:center; flex-wrap:wrap;
    padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--border);
    position:relative;
  }
  .icon-group.right{margin-left:auto;}

  /* 图标工具栏：扁平化、无边框图标/文字按钮，单击即用 */
  .iconbar{ gap:4px; }
  .icon-group{display:inline-flex; align-items:center; gap:2px;}
  .sep{width:1px; height:18px; background:var(--border); margin:0 6px; opacity:.65;}
  .ibtn{
    font:inherit; font-size:15px; line-height:1; cursor:pointer;
    width:32px; height:32px; padding:0;
    display:inline-flex; align-items:center; justify-content:center;
    border:0; border-radius:8px;
    background:transparent; color:var(--fg);
    transition:background .15s ease, color .15s ease;
  }
  .ibtn:hover{background:var(--btn-hover);}
  .ibtn.active{background:var(--accent); color:#fff;}
  .icon-select{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer;}
  .icon-select select{font:inherit; font-size:12px; padding:4px 8px; border:1px solid var(--border); border-radius:8px; background:transparent; color:var(--fg); cursor:pointer; transition:border-color .15s ease;}
  .icon-select select:hover{border-color:var(--accent);}
  /* 左侧常用功能（文件/导出）文字按钮，扁平无边框 */
  .tbtn{
    font:inherit; font-size:13px; line-height:1; cursor:pointer;
    height:32px; padding:0 10px; white-space:nowrap;
    display:inline-flex; align-items:center; justify-content:center;
    border:0; border-radius:8px;
    background:transparent; color:var(--fg);
    transition:background .15s ease, color .15s ease;
  }
  .tbtn:hover{background:var(--btn-hover);}
  .tbtn:active{background:var(--accent); color:#fff;}

  .main{flex:1; display:flex; min-height:0;}
  .pane{flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden;}
  .editor-pane{flex:0 0 auto; width:50%; min-width:0; display:flex; flex-direction:column; overflow:hidden; position:relative;}
  /* 拖拽分隔条 */
  .resizer{flex:0 0 6px; cursor:col-resize; background:var(--border); position:relative; transition:background .15s;}
  .resizer:hover, .resizer.active{background:var(--accent);}
  .resizer::after{content:""; position:absolute; top:0; bottom:0; left:-4px; right:-4px;}
  body.resizing{user-select:none; cursor:col-resize;}
  body.resizing iframe, body.resizing *{pointer-events:none;}
  .CodeMirror{height:100%; font-size:14px; line-height:1.6; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;}

  /* ===== 格式辅助命令面板（/ 与 、行首 触发） ===== */
  #cmdPalette{
    position:fixed; z-index:120; min-width:200px; max-width:300px;
    background:var(--bg); color:var(--fg);
    border:1px solid var(--border); border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
    padding:6px; max-height:300px; overflow:auto; font-size:13px;
  }
  .cmd-item{display:flex; align-items:baseline; gap:10px; padding:6px 10px; border-radius:6px; cursor:pointer;}
  .cmd-item.active{background:var(--accent); color:#fff;}
  .cmd-label{font-weight:600; white-space:nowrap;}
  .cmd-hint{color:var(--muted); font-size:12px; margin-left:auto; white-space:nowrap;}
  .cmd-item.active .cmd-hint{color:rgba(255,255,255,.85);}
  .cmd-empty{padding:8px 10px; color:var(--muted);}
  .preview-pane{flex:1; display:flex; min-height:0; background:var(--card-bg); overflow:auto;}
  /* 目录侧边栏 */
  .toc{flex:0 0 210px; overflow:auto; padding:22px 14px; background:var(--panel); border-right:1px solid var(--border);}
  .toc[hidden]{display:none;}
  /* 目录收起时同时隐藏其拖拽条 */
  #toc[hidden] + #resizerToc{display:none;}
  .toc-title{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; padding:0 6px;}
  .toc a{display:block; padding:5px 8px; color:var(--muted); text-decoration:none; border-radius:6px; font-size:13px; line-height:1.55; border-left:2px solid transparent; transition:background .12s,color .12s;}
  .toc a:hover{background:var(--btn-hover); color:var(--fg);}
  .toc a.active{color:var(--accent); border-left-color:var(--accent); background:var(--btn-hover); font-weight:600;}
  .toc .toc-h1{padding-left:6px; font-weight:600;}
  .toc .toc-h2{padding-left:18px;}
  .toc .toc-h3{padding-left:32px; font-size:12px; color:var(--muted);}
  .preview-pane .markdown-body{
    flex:0 1 auto; width:100%; max-width:var(--preview-max-width,880px); margin:0 auto; min-width:0; overflow:auto;
    background:var(--card); color:var(--ptheme-fg);
    border:1px solid var(--card-border); border-radius:14px;
    padding:40px 48px; box-shadow:0 1px 2px rgba(27,31,36,.04),0 10px 30px rgba(27,31,36,.06);
    font-size:var(--preview-font-size,16px); line-height:1.75;
  }
  .preview-pane .markdown-body > *:first-child{ margin-top:0; }
  .preview-pane .markdown-body > *:last-child{ margin-bottom:0; }

  .statusbar{
    display:flex; align-items:center; gap:8px; padding:5px 12px; font-size:12px; color:var(--muted);
    background:var(--panel); border-top:1px solid var(--border);
  }
  #statusClock{margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap;}

  /* 标签页栏（功能 7） */
  .tabbar{display:flex; align-items:stretch; gap:2px; padding:6px 10px 0; background:var(--panel); border-bottom:1px solid var(--border); overflow-x:auto;}
  .tab{display:flex; align-items:center; gap:8px; padding:7px 12px; font-size:13px; border:0; border-radius:8px 8px 0 0; background:transparent; color:var(--muted); cursor:pointer; white-space:nowrap; max-width:220px; transition:background .15s ease, color .15s ease;}
  .tab:hover{background:var(--btn-hover); color:var(--fg);}
  .tab.active{background:var(--bg); color:var(--fg); font-weight:600; box-shadow:inset 0 -2px 0 var(--accent);}
  .tab .name{overflow:hidden; text-overflow:ellipsis;}
  .tab .x{padding:0 4px; border-radius:4px; color:var(--muted); font-size:14px; line-height:1; transition:background .15s ease, color .15s ease;}
  .tab .x:hover{background:var(--btn-hover); color:var(--accent);}
  .tab-plus{padding:7px 10px; font-size:14px; border:0; border-radius:8px 8px 0 0; background:transparent; color:var(--muted); cursor:pointer; transition:background .15s ease, color .15s ease;}
  .tab-plus:hover{background:var(--btn-hover); color:var(--accent);}
  .tab.dragging{opacity:.4;}
  .tab.drop-before{box-shadow:inset 3px 0 0 var(--accent);}
  .tab.drop-after{box-shadow:inset -3px 0 0 var(--accent);}

  /* 编辑器内查找 / 替换 工具条 */
  .find-bar{position:absolute; top:8px; right:10px; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 8px; box-shadow:0 6px 20px rgba(0,0,0,.14); max-width:calc(100% - 20px);}
  .find-bar[hidden]{display:none;}
  .find-input{font:inherit; font-size:13px; padding:3px 8px; border:1px solid var(--border); border-radius:5px; background:var(--btn-bg); color:var(--fg); width:160px;}
  .find-input.no-match{border-color:#cf222e;}
  .find-opt{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:3px; cursor:pointer; user-select:none;}
  .find-count{font-size:12px; color:var(--muted); min-width:46px; text-align:center;}
  .find-btn{font:inherit; font-size:12px; padding:3px 9px; border:1px solid var(--border); border-radius:5px; background:var(--btn-bg); color:var(--fg); cursor:pointer;}
  .find-btn:hover{background:var(--btn-hover);}
  .find-replace-row{flex-basis:100%; display:flex; gap:6px; align-items:center;}
  .mermaid-block{text-align:center; margin:1.2em 0; overflow:auto;}
  .mermaid-block svg{max-width:100%;}

  /* ===== 周计划表（```plan 围栏渲染） ===== */
  .plan-table{border:1px solid var(--border); border-radius:10px; overflow:hidden; margin:1.2em 0; width:100%;}
  .plan-table table{width:100%; border-collapse:collapse; font-size:14px;}
  .plan-table th,.plan-table td{padding:11px 16px; border-bottom:1px solid var(--border); vertical-align:top; text-align:left;}
  .plan-table th{color:var(--muted); font-weight:600; background:var(--bg); text-align:center;}
  .plan-table .plan-wd{white-space:nowrap; font-weight:500; width:1%;}
  .plan-table .plan-date{white-space:nowrap; color:var(--muted); font-variant-numeric:tabular-nums; width:1%;}
  .plan-table .plan-body{width:100%; color:var(--ptheme-fg);}
  .plan-table tr:last-child td{border-bottom:0;}
  .plan-table tbody tr.plan-today{background:rgba(56,139,253,.14);}
  .plan-table tbody tr.plan-today .plan-date{color:var(--accent); font-weight:700;}

  /* 编辑器深色模式（不依赖外部主题文件） */
  [data-theme="dark"] .CodeMirror{ background:#0d1117; color:#e6edf3; border-color:#30363d; }
  [data-theme="dark"] .CodeMirror-gutters{ background:#0d1117; border-right:1px solid #21262d; }
  [data-theme="dark"] .CodeMirror-linenumber{ color:#6e7681; }
  [data-theme="dark"] .CodeMirror-cursor{ border-left-color:#e6edf3; }
  [data-theme="dark"] .CodeMirror-selected{ background:#264f78 !important; }
  [data-theme="dark"] .CodeMirror-activeline-background{ background:#161b22; }
  .CodeMirror .cm-bracket-match{ background:rgba(232,136,184,.35); border-radius:2px; box-shadow:0 0 0 1px rgba(232,136,184,.45); }
  [data-theme="dark"] .cm-comment{ color:#8b949e; }
  [data-theme="dark"] .cm-keyword, [data-theme="dark"] .cm-variable-3{ color:#ff7b72; }
  [data-theme="dark"] .cm-string, [data-theme="dark"] .cm-string-2{ color:#a5d6ff; }
  [data-theme="dark"] .cm-number, [data-theme="dark"] .cm-atom{ color:#79c0ff; }
  [data-theme="dark"] .cm-def{ color:#d2a8ff; }
  [data-theme="dark"] .cm-tag{ color:#7ee787; }
  [data-theme="dark"] .cm-attribute, [data-theme="dark"] .cm-property{ color:#79c0ff; }
  [data-theme="dark"] .cm-operator{ color:#ff7b72; }
  [data-theme="dark"] .cm-meta{ color:#8b949e; }

  /* 预览渲染美化 */
  .markdown-body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif; -webkit-font-smoothing:antialiased; }
  .markdown-body h1,.markdown-body h2{ border-bottom:1px solid var(--card-border); padding-bottom:.3em; }
  .markdown-body h1{ font-size:1.9em; margin-top:1.4em; }
  .markdown-body h2{ font-size:1.5em; margin-top:1.4em; }
  .markdown-body h3{ font-size:1.25em; }
  .markdown-body a{ color:var(--ptheme-link); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .15s; }
  .markdown-body a:hover{ border-bottom-color:var(--ptheme-link); }
  .markdown-body code{ background:var(--code-bg); border-radius:6px; padding:.2em .4em; font-size:.88em; font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace; }
  .markdown-body pre{ background:var(--code-bg); border:1px solid var(--card-border); border-radius:10px; padding:16px; overflow:auto; line-height:1.6; position:relative; }
  .code-wrap{position:relative;}
  .copy-btn{
    position:absolute; top:8px; right:8px; z-index:2;
    font:12px/1 -apple-system,"Segoe UI",sans-serif; cursor:pointer;
    padding:4px 8px; border:1px solid var(--card-border); border-radius:6px;
    background:var(--card); color:var(--ptheme-muted); opacity:0; transition:opacity .12s,color .12s,border-color .12s;
  }
  .code-wrap:hover .copy-btn{opacity:1;}
  .copy-btn.copied{opacity:1;}
  .copy-btn:hover{opacity:1; color:var(--ptheme-link); border-color:var(--ptheme-link);}
  .markdown-body pre code{ background:transparent; border:none; padding:0; font-size:.9em; }
  .markdown-body blockquote{ margin:1.1em 0; padding:.6em 1em; color:var(--ptheme-muted); border-left:4px solid var(--ptheme-quote-border); background:var(--quote-bg); border-radius:0 8px 8px 0; }
  .markdown-body table{ border-collapse:collapse; width:100%; font-size:.95em; }
  .markdown-body th,.markdown-body td{ padding:9px 14px; border:1px solid var(--card-border); }
  .markdown-body thead th{ background:var(--table-head); font-weight:600; }
  .markdown-body tbody tr:nth-child(2n){ background:rgba(127,127,127,.05); }
  .markdown-body hr{ border:none; height:1px; background:var(--card-border); margin:2em 0; }
  .markdown-body img{ max-width:100%; border-radius:8px; }
  .markdown-body ul li::marker{ color:var(--ptheme-accent); }
  .markdown-body input[type="checkbox"]{ accent-color:var(--ptheme-accent); }
  body,.toolbar,.statusbar,.preview-pane,.markdown-body{ transition:background-color .2s ease,color .2s ease,border-color .2s ease; }

  /* 目录默认展开时，编辑器让出目录宽度，避免预览被挤窄（仅分栏布局生效） */
  .main.toc-open .editor-pane{width:calc(50% - 105px);}
  /* 布局模式：仅编辑 / 仅预览（分栏为默认，无需特殊类） */
  .app.editor-only .preview-pane,
  .app.editor-only #resizer{display:none;}
  .app.preview-only .editor-pane,

const md = window.markdownit({
  html: true, linkify: true, typographer: true,
  highlight(str, lang){
    const open = '<pre class="hljs"><code' + (lang ? ' class="language-' + lang + '"' : '') + '>';
    if (lang && window.hljs.getLanguage(lang)) {
      try { return open + window.hljs.highlight(str, {language: lang, ignoreIllegals: true}).value + '</code></pre>'; } catch (e) {}

// ===== 周计划表：```plan 围栏渲染成「每天的计划表」 =====
// 格式：每行「日期 计划」，日期由人工输入（不自动生成），星期由日期推算。
//   支持 M/D、MM/DD、YYYY-MM-DD、YYYY/MM/DD；行首可带「周X」前缀（被忽略，星期以日期为准）。
//   当天（本地时钟）那一行自动变色高亮（不加文字标签）。
function planEscape(s){
  return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const PLAN_WD = ['周一','周二','周三','周四','周五','周六','周日'];
function planNorm(dateRaw){
  const p = String(dateRaw).split(/[-/]/).map(Number);
  let y, mo, da;
  if (p.length === 3){ y = p[0]; mo = p[1]; da = p[2]; }
  else if (p.length === 2){ y = new Date().getFullYear(); mo = p[0]; da = p[1]; }
  else return null;
  if (!(mo >= 1 && mo <= 12 && da >= 1 && da <= 31)) return null;
  const dt = new Date(y, mo - 1, da);
  if (isNaN(dt.getTime())) return null;
  return y + '-' + String(mo).padStart(2,'0') + '-' + String(da).padStart(2,'0');
}
function planFmt(dateRaw){
  const p = String(dateRaw).split(/[-/]/).map(Number);
  if (p.length === 3) return p[0] + '/' + p[1] + '/' + p[2];
  return p[0] + '/' + p[1];
}
function planInner(src){
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  const rows = [];
  const lines = (src || '').split(/\r?\n/);
  for (let raw of lines){
    const line = raw.trim();
    if (!line) continue;
    let rest = line;
    const wm = rest.match(/^(周[一二三四五六日天]|星期[一二三四五六日天])\s+(.*)$/);
    if (wm) rest = wm[2];
    const dm = rest.match(/^(\d{4}[-/]\d{1,2}[-/]\d{1,2}|\d{1,2}[-/]\d{1,2})\s+(.*)$/);
    if (!dm) continue;                       // 无日期的行忽略（日期需人工输入）
    const dateRaw = dm[1];
    const plan = dm[2].trim();
    const norm = planNorm(dateRaw);
    if (!norm) continue;
    const dt = new Date(norm + 'T00:00:00');
    const wd = PLAN_WD[(dt.getDay() + 6) % 7];
    const isToday = norm === todayStr;
    rows.push('<tr class="plan-row' + (isToday ? ' plan-today' : '') + '">'
      + '<td class="plan-wd">' + wd + '</td>'
      + '<td class="plan-date">' + planFmt(dateRaw) + '</td>'
      + '<td class="plan-body">' + planEscape(plan) + '</td></tr>');
  }
  if (!rows.length) rows.push('<tr><td class="plan-wd">—</td><td class="plan-date">—</td><td class="plan-body">（每行写「日期 计划」，如 <code>07/24 写周报</code>）</td></tr>');
  return '<table><thead><tr><th class="plan-wd">星期</th><th class="plan-date">日期</th><th class="plan-body">计划</th></tr></thead><tbody>' + rows.join('') + '</tbody></table>';
}
function renderPlanTable(src){
  return '<div class="plan-table" data-plan="' + planEscape(src) + '">' + planInner(src) + '</div>';
}
// 仅对 ```plan 围栏做特殊处理，其余语言（含 ```mermaid）仍走默认渲染
const _defaultFence = md.renderer.rules.fence || function(tokens, idx, options, env, self){ return self.renderToken(tokens, idx, options); };
md.renderer.rules.fence = function(tokens, idx, options, env, self){
  const info = ((tokens[idx].info) || '').trim();
  if (info === 'plan') return renderPlanTable(tokens[idx].content);
  return _defaultFence(tokens, idx, options, env, self);
};

// 行号映射：渲染时记录顶层块级 token 的源码行，渲染后写到 DOM 顶层子元素，
// 用于"基于行号"的同步滚动精确定位（替代原来按比例映射导致的对不上）。
let tocLines = [];
md.core.ruler.push('record_lines', state => {
  tocLines = [];
  for (const tok of state.tokens){
    if (tok.level === 0 && tok.type !== 'inline' && tok.nesting >= 0){
      // 顶层 open / 自闭合 token 各对应一个渲染出的子元素。
      // 个别 token（如 table_open）没有 map，用上一个行号兜底，保证 tocLines 数量
      // 与预览顶层子元素数量一致，否则表格之后同步滚动会错位。
      const ln = (tok.map && tok.map[0] != null) ? tok.map[0] : (tocLines.length ? tocLines[tocLines.length - 1] : 0);
      tocLines.push(ln);
    }
  }
});
function applyDataLines(){
  const kids = preview.children;
  const n = Math.min(kids.length, tocLines.length);
  for (let i = 0; i < n; i++){
    kids[i].setAttribute('data-line', String(tocLines[i]));
  }
}

  const pal = document.createElement('div');

  function filter(q){
    q = (q||'').toLowerCase();

  }
  function position(){
    const c = editor.cursorCoords(editor.getCursor(), 'window');   // 视口坐标（配合 position:fixed）
    const vw = window.innerWidth, vh = window.innerHeight, m = 6;

// 编辑区内联图片预览：把 ![alt](data:...) / http(s): 链接在编辑区替换成缩略图，
// 隐藏冗长的 base64 编码；源码文本保持不变（保存仍是完整 .md）。仅作用于 data:/http(s): 链接，
// 侧车相对路径（方案 B 已很短）与本地相对路径保持原文显示。
let editorImgMarks = [];
let lastImgSig = null;
function clearEditorImageMarks(){ for (const m of editorImgMarks){ try { m.clear(); } catch(e){} } editorImgMarks = []; }
function resetEditorImageView(){ clearEditorImageMarks(); lastImgSig = null; }
function collectImageTokens(){
  const text = editor.getValue();

  const tokens = [];

    const url = m[2];
    if (/^(data:|https?:)/i.test(url)) tokens.push({ index:m.index, len:m[0].length, alt:m[1], url });

}
function applyEditorImageWidgets(){
  const tokens = collectImageTokens();

  if (sig === lastImgSig) return;            // 图片集合未变化则跳过（避免闪烁与重复开销）
  lastImgSig = sig;
  clearEditorImageMarks();
  const cur = editor.getCursor();
  for (const t of tokens){
    const from = editor.posFromIndex(t.index);
    const to = editor.posFromIndex(t.index + t.len);
    // 光标若落在图片 token 内部，先移到 token 末尾，避免被原子 widget 困住无法编辑
    if (cur.line === from.line && cur.ch > from.ch && cur.ch < to.ch) editor.setCursor(to);
    const img = document.createElement('img');
    img.src = t.url;
    img.className = 'cm-inline-img';
    img.alt = t.alt || '';
    img.title = (t.alt || 'image') + '\n（双击删除此图片）';
    const mk = editor.markText(from, to, { replacedWith: img, handleMouseEvents: true });

// 方案 B 预览解析：exe 下，把源码里的相对图片路径（侧车文件）经原生桥接读回为 data URL 显示。
// 源码仍保留小巧的相对路径（可携）；仅预览临时用 data URL，不写回文件。
const assetCache = new Map();   // dir + '|' + rel -> dataUrl（null 表示读取失败，避免反复请求）
async function resolveAssetPaths(){
  if (!(window.pywebview && window.pywebview.api)) return;   // 仅 exe 需要；浏览器直开走内联
  const cur = activeDoc();
  const dir = cur && cur.path ? docDirOf(cur.path) : '';
  if (!dir) return;
  const imgs = preview.querySelectorAll('img[src]');
  for (const el of imgs){
    const v = el.getAttribute('src') || '';
    if (/^(https?:|data:|file:|#|mailto:)/i.test(v)) continue;  // 绝对/内联/锚点不动
    if (/^[a-zA-Z]:[\\/]/.test(v)) continue;                    // Windows 绝对路径
    if (v.startsWith('/')) continue;                            // 根绝对路径
    const key = dir + '|' + v;
    let dataUrl = assetCache.get(key);
    if (dataUrl === undefined){
      try {
        const r = await window.pywebview.api.read_image(dir, v);
        if (r && r.ok && r.data){ dataUrl = r.data; assetCache.set(key, dataUrl); }
        else { assetCache.set(key, null); continue; }
      } catch (e){ assetCache.set(key, null); continue; }

}
function updateStatus(){
  const text = editor.getValue();

  const minutes = Math.max(1, Math.round(cn / 400 + en / 200));
  const name = activeDoc() ? (activeDoc().name || '未命名') : '未命名';
  const c = editor.getCursor();
  const total = editor.lineCount();
  const pct = total ? Math.round((c.line + 1) / total * 100) : 0;
  statusLeftEl.textContent = name + '  ·  中文 ' + cn + ' 字  ·  英文 ' + en + ' 词  ·  约 ' + minutes + ' 分钟  ·  Ln ' + (c.line + 1) + '  Col ' + (c.ch + 1) + '  ·  进度 ' + pct + '%';
}
let quotaWarned = false;
function saveTabs(){
  try {
    const data = docs.map(d => ({ id:d.id, name:d.name, content:d.content, dirty:d.dirty }));
    localStorage.setItem('md-tabs', JSON.stringify({ docs: data, active: activeId }));
    quotaWarned = false;
  } catch (e) {
    // 含超大 base64 图片等大内容可能超出 localStorage 配额（通常约 5MB）
    const isQuota = !!(e && (e.name === 'QuotaExceededError' || e.code === 22 || e.code === 1014));
    if (isQuota){
      // 配额超限时退而求其次：剥离图片数据 URL，只保留文字与标签结构再存一次，
      // 避免整段丢失（否则刷新后新建的空白标签会回退成示例文档）。图片需点「保存」导出 .md 才保留。
      try {
        const slim = docs.map(d => ({
          id:d.id, name:d.name, dirty:d.dirty,
          content: (d.content || '').replace(/!\[[^\]]*\]\(data:[^)]*\)/g,
            '![图片](图片已超出浏览器本地缓存上限，请点「保存」导出 .md 以保留该图片)')
        }));
        localStorage.setItem('md-tabs', JSON.stringify({ docs: slim, active: activeId }));
        if (!quotaWarned){ quotaWarned = true; showToast('⚠️ 图片过大已超出本地自动保存上限：标签与文字已保留，请点「保存」把含图文档导出为 .md'); }
        return;
      } catch (e2) {}
    }
    if (!quotaWarned){
      quotaWarned = true;
      showToast('⚠️ 本地存储空间已满，含图片的文档无法自动保存，请及时「保存」导出 .md 备份');
    }
  }
}
function saveTabsDebounced(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveTabs, 400); }
function loadTabs(){
  try {
    const raw = localStorage.getItem('md-tabs');
    if (raw){
      const parsed = JSON.parse(raw);
      // 兼容旧格式（纯数组）：兼容解析为 docs，active 取首个
      const arr = Array.isArray(parsed) ? parsed : (parsed && parsed.docs);
      if (Array.isArray(arr) && arr.length){
        docs = arr.map(d => ({ id:d.id || uid(), name:d.name || '未命名', content:d.content || '', dirty:!!d.dirty }));
        const savedActive = Array.isArray(parsed) ? null : (parsed.active || null);

        activeId = (savedActive && docs.some(d => d.id === savedActive)) ? savedActive : docs[0].id;

  } catch (e) {}

}
function clearDragIndicators(){
  document.querySelectorAll('.tab.drop-before,.tab.drop-after').forEach(t => t.classList.remove('drop-before', 'drop-after'));
}
// 拖拽换位置：把 srcId 移动到 targetId 之前(after=false)或之后(after=true)
function reorderDocs(srcId, targetId, after){
  if (!srcId || srcId === targetId) return;
  const from = docs.findIndex(d => d.id === srcId);
  if (from < 0) return;
  const [moved] = docs.splice(from, 1);
  const to = docs.findIndex(d => d.id === targetId);
  if (to < 0) docs.push(moved);
  else docs.splice(after ? to + 1 : to, 0, moved);
  renderTabs(); saveTabs();
}
function renderTabs(){
  const bar = $('#tabbar');
  if (!bar) return;
  bar.innerHTML = '';
  docs.forEach(d => {
    const t = document.createElement('div');
    t.className = 'tab' + (d.id === activeId ? ' active' : '');
    t.draggable = true;
    const name = document.createElement('span'); name.className = 'name';
    name.textContent = d.name + (d.dirty ? ' •' : '');
    name.title = '双击重命名 · 拖拽可调整顺序';
    name.addEventListener('dblclick', ev => { ev.stopPropagation(); startRename(d, name); });
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '×';
    x.addEventListener('click', ev => { ev.stopPropagation(); closeTab(d.id); });
    t.appendChild(name); t.appendChild(x);

      setTimeout(() => { dragJustHappened = false; }, 60);

}
function startRename(d, nameEl){
  const input = document.createElement('input');

function switchTo(id){

function newDoc(){

// 说明：CodeMirror 的 closebrackets/matchbrackets 是独立 addon，vendor/ 未内置；
// 这里用极小的自实现替代，避免引入新依赖、保持单文件轻量离线。
const BRACE_OPEN = '([{';
const BRACE_CLOSE = ')]}';
const BRACE_PAIR = { '(':')', '[':']', '{':'}', '"':'"', "'":"'", '`':'`' };
const BRACE_OPEN_OF = { ')':'(', ']':'[', '}':'{' };   // 闭合 → 开放
const BRACE_CLOSE_OF = { '(':')', '[':']', '{':'}' };  // 开放 → 闭合
function isPaletteOpen(){ const p = document.getElementById('cmdPalette'); return !!(p && p.style.display !== 'none'); }

// —— 括号自动闭合 ——
editor.on('inputRead', (cm, change) => {
  if (isPaletteOpen()) return;                       // 命令面板输入时不干扰
  const typed = change.text;
  if (!typed || typed.length !== 1) return;          // 仅处理单字符键入（忽略 IME 多字/换行）
  const ch = typed[0];
  const cur = cm.getCursor();
  if (BRACE_CLOSE.includes(ch)){
    // 光标右侧已是同款闭合符 → 直接跳过，避免 ())
    const next = cm.getLine(cur.line)[cur.ch];
    if (next === ch) cm.setCursor({line:cur.line, ch:cur.ch + 1});
    return;                                          // 其余交给默认行为
  }
  if (!(ch in BRACE_PAIR)) return;
  if (cm.getSelection()) return;                     // 有选区时不自动闭合，避免吞掉选区
  const next = cm.getLine(cur.line)[cur.ch];
  if (next === BRACE_PAIR[ch]){ cm.setCursor(cur); return; }  // 右侧已有闭合符 → 只停留在中间
  cm.replaceRange(BRACE_PAIR[ch], cur);              // 插入闭合符
  cm.setCursor(cur);                                 // 光标留在中间
});

// —— 括号匹配高亮 ——
let bracketMarks = [];
function clearBracketMarks(){ bracketMarks.forEach(m => { try { m.clear(); } catch (e) {} }); bracketMarks = []; }
function markBracketAt(line, ch){
  bracketMarks.push(editor.markText({line, ch}, {line, ch: ch + 1}, {className: 'cm-bracket-match'}));

function updateBracketMatch(){
  clearBracketMarks();

  const line = editor.getLine(cur.line);
  const before = cur.ch > 0 ? line[cur.ch - 1] : '';
  const at = line[cur.ch] || '';
  let anchorLine, anchorCh, seek, dir;
  // 注意：at/before 可能为空串，而 String.includes('') 恒为 true，必须先判非空，否则行尾/行首光标会误判
  if (at && BRACE_OPEN.includes(at)){ anchorLine = cur.line; anchorCh = cur.ch; seek = at; dir = 1; }
  else if (before && BRACE_CLOSE.includes(before)){ anchorLine = cur.line; anchorCh = cur.ch - 1; seek = BRACE_OPEN_OF[before]; dir = -1; }
  else return;
  let depth = 1, budget = 6000, found = null;        // budget 防止超大文档无匹配时整篇扫描掉帧
  if (dir === 1){
    for (let l = anchorLine; l < editor.lineCount() && !found; l++){
      const text = editor.getLine(l);
      const start = l === anchorLine ? anchorCh + 1 : 0;
      for (let c = start; c < text.length; c++){
        const x = text[c];
        if (x === seek) depth++;
        else if (x === BRACE_CLOSE_OF[seek]) depth--;
        if (depth === 0){ found = {line:l, ch:c}; break; }
        if (--budget < 0) break;
      }
    }

    for (let l = anchorLine; l >= 0 && !found; l--){
      const text = editor.getLine(l);
      const end = l === anchorLine ? anchorCh - 1 : text.length - 1;
      for (let c = end; c >= 0; c--){
        const x = text[c];
        if (x === BRACE_CLOSE_OF[seek]) depth++;
        else if (x === seek) depth--;
        if (depth === 0){ found = {line:l, ch:c}; break; }
        if (--budget < 0) break;
      }
    }
  }
  if (found){ markBracketAt(anchorLine, anchorCh); markBracketAt(found.line, found.ch); }
}
editor.on('cursorActivity', updateBracketMatch);

// —— 图片插入：方案 B（侧车文件）——
// 桌面 exe（window.pywebview.api 存在）且当前文档已保存到磁盘时，把图片写到 .md 同目录的
// images/ 子文件夹，源码用相对路径引用（如 images/img_xxx.png），让 .md 保持小巧、可携；
// 预览里再把相对路径经桥接读回为 data URL 显示（见 resolveAssetPaths）。
// 浏览器直开（无 api）或文档尚未保存时，回退为 base64 内联，保证可用性。
function docDirOf(p){
  if (!p) return '';
  const i = Math.max(p.lastIndexOf('/'), p.lastIndexOf('\\'));
  return i >= 0 ? p.slice(0, i) : '';
}
function imgExtOf(type){
  const m = { 'image/png':'png','image/jpeg':'jpg','image/jpg':'jpg','image/gif':'gif','image/webp':'webp','image/bmp':'bmp','image/svg+xml':'svg' };
  return m[type] || 'png';
}
async function saveSidecarImage(docPath, file, dataUrl){
  try {
    const dir = docDirOf(docPath);
    if (!dir) return null;
    const ext = imgExtOf(file.type);
    const fname = 'img_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6) + '.' + ext;
    const rel = 'images/' + fname;
    const body = String(dataUrl).replace(/^data:[^;]*;base64,/, '');
    const r = await window.pywebview.api.save_image(dir, rel, body);
    if (r && r.error){ console.error('[侧车] 写入失败:', r.error); return null; }
    if (r && r.ok) return rel;
    return null;
  } catch (e){ console.error('[侧车] 异常:', e); return null; }
}
function insertImageFile(file){
  if (!file || !/^image\//.test(file.type)) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const alt = (file.name || 'image').replace(/\.[^.]+$/, '');
    const cur = activeDoc();
    if (window.pywebview && window.pywebview.api && cur && cur.path){
      const rel = await saveSidecarImage(cur.path, file, reader.result);
      if (rel){
        editor.replaceRange('\n![' + alt + '](' + rel + ')\n', editor.getCursor());
        showToast('已插入图片（侧车文件）：' + rel);
        return;
      }
      // 侧车失败（目录无写权限等）则回退内联
    }
    editor.replaceRange('\n![ ' + alt + ' ](' + reader.result + ')\n', editor.getCursor());
    showToast('已插入图片：' + (file.name || 'image'));
  };
  reader.readAsDataURL(file);
}
// 去重：从桌面拖文件进编辑器时，浏览器常同时/相近触发 drop 与一次合成的 paste，
// 二者都处理图片会插入两份；部分浏览器还会把 paste 延后到 drop 之后，或触发两次 drop。
// 改按「文件签名(名|字节数|修改时间|类型)」去重，同一文件在窗口期内只插入一次，
// 与触发顺序、事件间隔解耦。窗口 1s，足以覆盖同一拖放内的各类重复事件。
const imgInsertGuard = new Map();   // sig -> 过期时间戳(ms)
function imgSig(file){
  // 用「字节长度|类型」作去重键：拖放时浏览器常额外合成一次 paste，
  // 其 getAsFile() 的文件名/修改时间与 drop 的原文件不同，但字节长度与 MIME 必相同，
  // 用 size|type 才能跨事件正确合并为同一文件。
  return (file.size || 0) + '|' + (file.type || '');
}
function claimImageInsert(file){
  const sig = imgSig(file);
  const now = Date.now();
  for (const [k, exp] of imgInsertGuard){ if (exp < now) imgInsertGuard.delete(k); }
  if (imgInsertGuard.has(sig)) return false;   // 同一文件本窗口内已由另一事件认领
  imgInsertGuard.set(sig, now + 1000);
  return true;
}
editor.on('paste', (cm, event) => {
  const dt = event.clipboardData;
  if (!dt) return;
  for (const it of (dt.items || [])){
    if (it.kind === 'file' && /^image\//.test(it.type)){
      const f = it.getAsFile();
      if (f){
        if (!claimImageInsert(f)) return;        // 同一文件已由 drop/另一次粘贴认领，跳过
        insertImageFile(f); event.preventDefault();
      }
      break;
    }
  }
});
editor.on('drop', (cm, event) => {
  const dt = event.dataTransfer;
  if (!dt || !dt.files || !dt.files.length) return;
  const imgs = Array.from(dt.files).filter(f => /^image\//.test(f.type));
  if (!imgs.length) return;
  event.preventDefault();                        // 图片拖放一律阻止默认行为（避免浏览器打开/插入链接）
  const toInsert = imgs.filter(f => claimImageInsert(f));   // 仅保留本窗口内未被认领的文件
  if (toInsert.length){
    cm.setCursor(cm.coordsChar({ left: event.clientX, top: event.clientY }));
    toInsert.forEach(insertImageFile);
  }
});

// 滚动同步（基于行号映射：编辑器顶部可见行 → 预览对应块；反向同理。
// 替代原来"按比例"映射，解决图片/代码块/Mermaid/公式导致高度不一致时对不上的问题。）
const previewPane = preview;
let syncing = false;

function blockTopInPane(b){
  const pr = previewPane.getBoundingClientRect();
  const br = b.getBoundingClientRect();
  return br.top - pr.top + previewPane.scrollTop;
}
function syncPreviewFromEditor(){
  if (!syncOn || syncing) return;
  syncing = true;
  const info = editor.getScrollInfo();
  const viewH = info.clientHeight;
  const maxScroll = info.height - viewH;
  const a = maxScroll > 0 ? Math.min(1, Math.max(0, info.top / maxScroll)) : 0;
  // 锚定在编辑器视口比例为 a 的那一行（顶部 a=0、中部 a=0.5、底部 a=1），并让它在预览里
  // 也落在同一比例处：顶部贴顶、底部贴底、中段居中，且两栏永不漂移。
  const anchorY = info.top + a * viewH;
  const line = editor.lineAtHeight(anchorY, 'local');
  const blocks = preview.querySelectorAll('[data-line]');
  let target = null;
  for (const b of blocks){
    const bl = +b.getAttribute('data-line');
    if (bl <= line) target = b; else break;
  }
  if (target){
    if (info.top + viewH >= info.height - 2){
      previewPane.scrollTop = previewPane.scrollHeight;   // 滚到最底：吸底，避免末尾对不上
    } else {
      const blockH = target.offsetHeight || 0;
      const pViewH = previewPane.clientHeight;
      const desiredTopInView = a * Math.max(0, pViewH - blockH);
      previewPane.scrollTop = Math.max(0, blockTopInPane(target) - desiredTopInView);
    }
  }
  requestAnimationFrame(() => { syncing = false; });
}
function syncEditorFromPreview(){
  if (!syncOn || syncing) return;
  syncing = true;
  const si = editor.getScrollInfo();
  const top = previewPane.scrollTop;
  const pViewH = previewPane.clientHeight;
  const pMax = previewPane.scrollHeight - pViewH;
  const a = pMax > 0 ? Math.min(1, Math.max(0, top / pMax)) : 0;
  // 镜像：锚定在预览视口比例为 a 的那一块，让它在编辑器里也落在同一比例处。
  if (top + pViewH >= previewPane.scrollHeight - 2){
    editor.scrollTo(null, Math.max(0, si.height - si.clientHeight));
  } else {
    const anchorY = top + a * pViewH;
    const blocks = preview.querySelectorAll('[data-line]');
    let target = null;
    for (const b of blocks){
      if (blockTopInPane(b) <= anchorY + 4) target = b; else break;
    }
    if (target){
      const line = +target.getAttribute('data-line');
      const lineTop = editor.heightAtLine(line, 'local');
      const desiredTopInView = a * Math.max(0, si.clientHeight - editor.defaultTextHeight());
      editor.scrollTo(null, Math.max(0, lineTop - desiredTopInView));
    }
  }
  requestAnimationFrame(() => { syncing = false; });
}
editor.on('scroll', syncPreviewFromEditor);
previewPane.addEventListener('scroll', syncEditorFromPreview);
previewPane.addEventListener('scroll', syncTocActive);

// 正文里的锚点链接 [文本](#slug) 也走预览容器内滚动（而非整窗跳转）

// 文件保存（支持 File System Access API 原地覆盖“当前对象”，不支持时回退为下载）
const fsAccess = ('showSaveFilePicker' in window) && ('showOpenFilePicker' in window);
async function writeHandle(handle, text){
  const w = await handle.createWritable();
  await w.write(text); await w.close();
}
function downloadText(text, name){
  const blob = new Blob([text], {type:'text/markdown;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}
async function saveFile(){
  const d = activeDoc();
  if (!d) return;
  const text = editor.getValue(); d.content = text;
  const name = d.name || 'untitled.md';
  if (window.pywebview && window.pywebview.api){   // 桌面 exe：原生桥接真·保存（path 为空则弹保存框）
    try {
      const r = await window.pywebview.api.save_file(d.path || '', text);
      if (r && r.error){ showToast('保存失败：' + r.error); return; }
      if (r && r.path){ d.path = r.path; d.name = r.name; d.dirty = false; renderTabs(); saveTabs(); showToast('已保存 · ' + d.name); }
      return;
    } catch(e){ /* 回退下方 */ }
  }
  if (d.handle){                                   // 真·原地保存：覆盖当前打开的文件
    try {
      let perm = 'granted';
      if (d.handle.queryPermission) perm = await d.handle.queryPermission({mode:'readwrite'});
      if (perm !== 'granted' && d.handle.requestPermission) perm = await d.handle.requestPermission({mode:'readwrite'});
      if (perm !== 'granted') throw new Error('no-perm');
      await writeHandle(d.handle, text);
      d.dirty = false; renderTabs(); showToast('已保存 · ' + name); return;
    } catch(e){ /* 权限被拒或不可写，继续下方获取句柄/下载 */ }
  }
  if (fsAccess){                                   // 无句柄但 API 可用（如 localhost/https）：用保存框拿到可写句柄并记住，下次即可覆盖
    try {
      const handle = await window.showSaveFilePicker({ suggestedName:name, types:[{description:'Markdown', accept:{'text/markdown':['.md','.markdown'], 'text/plain':['.txt']}}] });
      await writeHandle(handle, text);
      d.handle = handle; d.name = handle.name; d.dirty = false; renderTabs(); saveTabs();
      showToast('已保存 · ' + d.name); return;
    } catch(e){ if (e && e.name === 'AbortError') return; }
  }
  downloadText(text, name);                        // 回退：file:// 等不支持 API 的环境，以当前文件名下载
  d.dirty = false; renderTabs();
  showToast(location.protocol === 'file:' ? '已下载（file:// 下无法原地保存，用 http://localhost 打开即可覆盖原文件）' : '已下载 · ' + name);
}
async function saveAs(){
  const d = activeDoc();
  if (!d) return;
  const text = editor.getValue(); d.content = text;
  const name = d.name || 'untitled.md';
  if (window.pywebview && window.pywebview.api){   // 桌面 exe：原生桥接另存为
    try {
      const r = await window.pywebview.api.save_file_as(text, name);
      if (r && r.error){ showToast('保存失败：' + r.error); return; }
      if (r && r.path){ d.path = r.path; d.name = r.name; d.dirty = false; renderTabs(); saveTabs(); showToast('已另存为 · ' + d.name); }
      return;
    } catch(e){ /* 回退下方 */ }
  }
  if (fsAccess){
    try {
      const handle = await window.showSaveFilePicker({ suggestedName:name, types:[{description:'Markdown', accept:{'text/markdown':['.md','.markdown'], 'text/plain':['.txt']}}] });
      await writeHandle(handle, text);
      d.handle = handle; d.name = handle.name; d.dirty = false; renderTabs(); saveTabs();
      showToast('已另存为 · ' + d.name); return;
    } catch(e){ if (e && e.name === 'AbortError') return; }
  }
  const nn = await askFilename(name);              // 不支持 FS API 时，输入新文件名后下载
  if (!nn) return;
  d.name = nn; d.dirty = false; renderTabs(); saveTabs();
  downloadText(text, nn); showToast('已另存为 · ' + nn);
}
function askFilename(def){
  return new Promise(resolve => {
    const mask = document.createElement('div'); mask.className = 'modal-mask';
    mask.innerHTML = '<div class="modal" style="max-width:360px"><h3>另存为</h3>'
      + '<input id="askName" type="text" value="' + (def||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') + '" style="width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--btn-bg);color:var(--fg);box-sizing:border-box">'
      + '<div class="close"><button class="modal-btn" data-act="ok">确定</button> <button class="modal-btn" data-act="cancel">取消</button></div></div>';
    document.body.appendChild(mask);
    const input = mask.querySelector('#askName');
    const close = v => { mask.remove(); resolve(v); };
    mask.addEventListener('click', e => { if (e.target === mask) close(null); });
    const ok = () => { let v = (input.value.trim() || def); if (!/\.(md|markdown|txt)$/i.test(v)) v += '.md'; close(v); };
    mask.querySelector('[data-act="ok"]').addEventListener('click', ok);
    mask.querySelector('[data-act="cancel"]').addEventListener('click', () => close(null));
    input.addEventListener('keydown', e => { if (e.key === 'Enter') ok(); if (e.key === 'Escape') close(null); });
    setTimeout(() => input.focus(), 30);
  });
}

// 主题
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  // 预览渲染主题配色独立，卡片始终按 light 渲染（纸质感），不随 app 暗色反转
  preview.setAttribute('data-color-mode', 'light');
  editor.setOption('theme', 'default');
  // 注意：代码高亮（hljs）配色改由 applyPtheme 控制，跟随渲染主题深浅，此处不再干预
  try { localStorage.setItem('md-theme', t); } catch (e) {}
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
  syncPthemeToTheme();
}
// 深色 app 下预览渲染主题跟随变深：app 切到暗色时，若当前是浅色渲染主题则自动切 github-dark；
// app 切回亮色时，若当前是 github-dark 则自动回 github。dracula 已属深色，保留用户显式选择。
function syncPthemeToTheme(){
  const appDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const cur = document.documentElement.getAttribute('data-ptheme') || 'github';
  const lightThemes = ['github', 'newspaper', 'mint', 'lavender', 'blossom'];
  if (appDark && lightThemes.indexOf(cur) >= 0) applyPtheme('github-dark');
  else if (!appDark && cur === 'github-dark') applyPtheme('github');
}

  // 注：时间 / 文件位置 由浏览器打印对话框的「页眉和页脚」控制，无法用代码强制关闭，

// 左右拖拽分隔条（编辑器↔预览，目录↔编辑器）
(function(){
  const main = document.querySelector('.main');
  const resizer = $('#resizer');
  const editorPane = document.querySelector('.editor-pane');
  const tocEl = document.getElementById('toc');
  const resizerToc = $('#resizerToc');
  let dragging = null; // 'split' | 'toc'

  function startDrag(kind, handle, e){
    dragging = kind; handle.classList.add('active');
    document.body.classList.add('resizing'); e.preventDefault();
  }
  resizer.addEventListener('mousedown', e => startDrag('split', resizer, e));
  if (resizerToc) resizerToc.addEventListener('mousedown', e => startDrag('toc', resizerToc, e));

  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const rect = main.getBoundingClientRect();
    if (dragging === 'split'){
      // 以编辑器实际左边界为基准，避免被左侧目录宽度偏移导致分隔条不跟手
      const eRect = editorPane.getBoundingClientRect();
      let pct = (e.clientX - eRect.left) / rect.width * 100;
      pct = Math.max(20, Math.min(80, pct));
      editorPane.style.width = pct + '%';
    } else if (dragging === 'toc' && tocEl){
      let w = e.clientX - rect.left;
      w = Math.max(140, Math.min(360, w));
      tocEl.style.flex = '0 0 ' + w + 'px';
    }
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = null;
    resizer.classList.remove('active');
    if (resizerToc) resizerToc.classList.remove('active');
    document.body.classList.remove('resizing');
    editor.refresh();
    try {
      localStorage.setItem('md-split', editorPane.style.width);
      if (tocEl) localStorage.setItem('md-toc-width', tocEl.style.flex);
    } catch (e) {}
  });

// ===== 编辑器内查找 / 替换（自实现，无外部 addon，完全离线）=====
const findBarEl = document.getElementById('findBar');
const findInputEl = document.getElementById('findInput');
const findCaseEl = document.getElementById('findCase');
const findRegexEl = document.getElementById('findRegex');
const findCountEl = document.getElementById('findCount');
const findReplaceRowEl = document.getElementById('findReplaceRow');
const findReplaceInputEl = document.getElementById('findReplaceInput');
let search = { query:'', caseSens:false, regex:false, matches:[], idx:-1 };

function findMatches(text, query, caseSens, useRegex){
  const res = [];
  if (!query) return res;
  if (useRegex){
    let re;
    try { re = new RegExp(query, caseSens ? 'g' : 'gi'); } catch (e) { return res; }
    let m;
    while ((m = re.exec(text)) !== null){
      const s = m.index, e = s + m[0].length;
      if (e === s){ if (re.lastIndex <= s) re.lastIndex = s + 1; if (re.lastIndex > text.length) break; continue; }
      res.push([s, e]);
      if (re.lastIndex <= s) re.lastIndex = e;
    }
  } else {
    const t = caseSens ? text : text.toLowerCase();
    const q = caseSens ? query : query.toLowerCase();
    let i = 0;
    while ((i = t.indexOf(q, i)) !== -1){ res.push([i, i + q.length]); i += q.length; }
  }
  return res;
}
function computeMatches(){
  const doc = editor.getDoc();
  const idxs = findMatches(doc.getValue(), search.query, search.caseSens, search.regex);
  search.matches = idxs.map(([s,e]) => ({ from: doc.posFromIndex(s), to: doc.posFromIndex(e) }));
  search.idx = search.matches.length ? 0 : -1;
}
function updateCount(){
  const n = search.matches.length;
  findCountEl.textContent = n ? (search.idx + 1) + ' / ' + n : (search.query ? '0' : '');
}
function gotoMatch(i){
  if (!search.matches.length) return;
  search.idx = (i % search.matches.length + search.matches.length) % search.matches.length;
  const m = search.matches[search.idx];
  editor.setSelection(m.from, m.to);
  editor.scrollIntoView(m.to, 60);
  updateCount();
  findInputEl.focus();
}
function runSearch(reset){
  search.query = findInputEl.value;
  search.caseSens = findCaseEl.checked;
  search.regex = findRegexEl.checked;
  computeMatches();
  findInputEl.classList.toggle('no-match', !!search.query && !search.matches.length);
  if (search.matches.length){ if (reset) search.idx = 0; gotoMatch(search.idx); }
  else { search.idx = -1; updateCount(); }
}
function openFind(replaceMode){
  findBarEl.removeAttribute('hidden');
  if (replaceMode) findReplaceRowEl.removeAttribute('hidden');
  findInputEl.focus(); findInputEl.select();
}
function closeFind(){
  findBarEl.setAttribute('hidden', '');
  const c = editor.getCursor(); editor.setCursor(c); // 收起高亮选区
}
function doReplace(){
  if (search.idx < 0) return;
  const m = search.matches[search.idx];
  editor.replaceRange(findReplaceInputEl.value, m.from, m.to);
  runSearch(false);
}
function doReplaceAll(){
  const doc = editor.getDoc();
  const idxs = findMatches(doc.getValue(), search.query, search.caseSens, search.regex);
  if (!idxs.length) return;
  let n = 0;
  for (let i = idxs.length - 1; i >= 0; i--){
    doc.replaceRange(findReplaceInputEl.value, doc.posFromIndex(idxs[i][0]), doc.posFromIndex(idxs[i][1]));
    n++;
  }
  showToast('已替换 ' + n + ' 处');
  runSearch(true);
}
if (findBarEl){
  findInputEl.addEventListener('input', () => runSearch(true));
  findInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); gotoMatch(search.idx + (e.shiftKey ? -1 : 1)); }
    else if (e.key === 'Escape'){ e.preventDefault(); closeFind(); }
  });
  findCaseEl.addEventListener('change', () => runSearch(true));
  findRegexEl.addEventListener('change', () => runSearch(true));
  document.getElementById('findNext').addEventListener('click', () => gotoMatch(search.idx + 1));
  document.getElementById('findPrev').addEventListener('click', () => gotoMatch(search.idx - 1));
  document.getElementById('findReplaceBtn').addEventListener('click', () => {
    findReplaceRowEl.hasAttribute('hidden') ? findReplaceRowEl.removeAttribute('hidden') : findReplaceRowEl.setAttribute('hidden', '');
  });
  document.getElementById('findReplace').addEventListener('click', doReplace);
  document.getElementById('findReplaceAll').addEventListener('click', doReplaceAll);
  document.getElementById('findClose').addEventListener('click', closeFind);
}

// 3. 目录(TOC)侧边栏
function slugify(text){
  return (text || '').trim().toLowerCase()
    .replace(/\s+/g, '-')
    .replace(/[^\w\u4e00-\u9fa5\-]/g, '')
    .replace(/\-+/g, '-')
    .replace(/^\-+|\-+$/g, '');
}
function buildToc(){
  const toc = document.getElementById('toc');
  if (!toc) return;
  const heads = preview.querySelectorAll('h1,h2,h3');
  const seen = {};
  let html = '<p class="toc-title">目录</p>';
  heads.forEach(h => {
    const level = parseInt(h.tagName.substring(1), 10); // 1..3
    const text = h.textContent || '';
    // 语义化锚点（中文保留），正文里写 [文本](#slug) 也能直接跳转到此标题
    let base = slugify(text) || ('h' + level);
    let slug = base, n = 1;
    while (seen[slug]) { slug = base + '-' + (++n); }
    seen[slug] = true;
    h.id = slug;
    html += '<a href="#' + slug + '" class="toc-item toc-h' + level + '" data-target="' + slug + '">' +
            md.utils.escapeHtml(text) + '</a>';
  });
  toc.innerHTML = heads.length
    ? html
    : '<p class="toc-title">目录</p><p style="padding:0 6px;color:var(--muted);font-size:12px;">暂无标题</p>';
  toc.querySelectorAll('a[data-target]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const el = document.getElementById(a.getAttribute('data-target'));
      if (el){
        toc.querySelectorAll('a.active').forEach(x => x.classList.remove('active'));
        a.classList.add('active');
        previewPane.scrollTop = Math.max(0, blockTopInPane(el) - 10);
      }
    });
  });
}

    if (a) a.classList.add('active');
  }
}

// 5a. 导出自包含 HTML（内联编辑器样式 + github-markdown 基础样式 + 当前 hljs 主题，独立可用）
async function exportHtml(){
  const d = activeDoc();
  const title = (d && d.name ? d.name : 'document').replace(/\.(md|markdown|txt)$/i, '');
  const ptheme = document.documentElement.getAttribute('data-ptheme') || 'github';
  const styleText = (document.querySelector('style') || {}).textContent || '';
  // 内联 github-markdown 基础样式：列表缩进 / 标题 / 表格等排版依赖它。本地优先，
  // file:// 下 fetch 可能失败则降级（仍导出，仅基础排版可能略有偏差并提示）。
  let extraCss = '';
  try {
    const r = await fetch('vendor/github-markdown.css');
    if (r.ok) extraCss += await r.text();
  } catch (e) { /* file:// 降级 */ }
  // 代码高亮配色跟随渲染主题深浅
  const isDark = (ptheme === 'github-dark' || ptheme === 'dracula');
  try {
    const r = await fetch(isDark ? 'vendor/hljs-github-dark.min.css' : 'vendor/hljs-github.min.css');
    if (r.ok) extraCss += '\n' + await r.text();
  } catch (e) { /* file:// 降级 */ }
  const clone = preview.cloneNode(true);
  clone.querySelectorAll('.copy-btn').forEach(b => b.remove());
  const doc = '<!DOCTYPE html>\n<html lang="zh-CN" data-theme="light" data-ptheme="' + ptheme + '">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n<title>' + title + '</title>\n<style>\n' + styleText + '\n' + extraCss + '\n</style>\n</head>\n<body>\n<div class="preview-pane"><article class="markdown-body" data-color-mode="light">' + clone.innerHTML + '</article></div>\n</body>\n</html>';
  const blob = new Blob([doc], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = title + '.html';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
  if (!extraCss) showToast('已导出；本环境未能内联 github-markdown 基础样式，列表缩进等可能略有偏差');
}

// 9. Mermaid 图表 + KaTeX 公式（本地 vendor 优先，失败回退 CDN，再失败不崩）
function loadScript(urls){
  return new Promise((resolve, reject) => {
    let i = 0;
    (function next(){
      if (i >= urls.length){ reject(new Error('script load failed')); return; }
      const s = document.createElement('script');
      s.src = urls[i++]; s.onload = () => resolve();
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  });
}
function loadCss(urls){
  return new Promise((resolve, reject) => {
    let i = 0;
    (function next(){
      if (i >= urls.length){ reject(new Error('css load failed')); return; }
      const l = document.createElement('link');
      l.rel = 'stylesheet'; l.href = urls[i++]; l.onload = () => resolve();
      l.onerror = () => { l.remove(); next(); };
      document.head.appendChild(l);
    })();
  });
}
let mermaidReady = false, mermaidPromise = null;
function ensureMermaid(){
  if (mermaidReady && window.mermaid) return Promise.resolve(true);
  if (mermaidPromise) return mermaidPromise;
  mermaidPromise = (async () => {
    try {
      await loadScript(['vendor/mermaid.min.js', 'https://lib.baomitu.com/mermaid/9.4.3/dist/mermaid.min.js', 'https://cdn.staticfile.org/mermaid/9.4.3/dist/mermaid.min.js', 'https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js']);
      if (window.mermaid){ window.mermaid.initialize({ startOnLoad:false, securityLevel:'loose' }); mermaidReady = true; return true; }
    } catch (e) {}
    return false;
  })();
  return mermaidPromise;
}
let katexReady = false, katexPromise = null;
function ensureKatex(){
  if (katexReady && window.katex && window.renderMathInElement) return Promise.resolve(true);
  if (katexPromise) return katexPromise;
  katexPromise = (async () => {
    try {
      await loadCss(['vendor/katex/katex.min.css', 'https://lib.baomitu.com/KaTeX/0.16.9/katex.min.css', 'https://cdn.staticfile.org/KaTeX/0.16.9/katex.min.css', 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css']);
      await loadScript(['vendor/katex/katex.min.js', 'https://lib.baomitu.com/KaTeX/0.16.9/katex.min.js', 'https://cdn.staticfile.org/KaTeX/0.16.9/katex.min.js', 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js']);
      await loadScript(['vendor/katex/contrib/auto-render.min.js', 'https://lib.baomitu.com/KaTeX/0.16.9/contrib/auto-render.min.js', 'https://cdn.staticfile.org/KaTeX/0.16.9/contrib/auto-render.min.js', 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js']);
      if (window.katex && window.renderMathInElement){ katexReady = true; return true; }
    } catch (e) {}
    return false;
  })();
  return katexPromise;
}
// 货币保护：渲染公式前，把明显是金额（如 $5、$5.99、$1,000）的 $ 用 .katex-ignore 包裹，
// 避免被 KaTeX 当成行内公式；真正的 $...$ / \(...\) 公式不受影响（数字后紧跟字母/$ 的不视为货币，
// 如 $2x$、$\frac{1}{2}$、$3.14$ 仍按公式处理）。
function protectInlineMath(root){
  const re = /\$(\d[\d,]*(?:\.\d+)?)(?![.\d])(?![A-Za-z$])/g;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null, false);
  const nodes = [];
  let tn;
  while ((tn = walker.nextNode())){
    if (!tn.nodeValue || tn.nodeValue.indexOf('$') < 0) continue;
    const p = tn.parentNode;
    if (!p) continue;
    if (p.closest && (p.closest('pre') || p.closest('code') || p.closest('.katex') || p.closest('.katex-ignore'))) continue;
    nodes.push(tn);
  }
  nodes.forEach(tn => {
    const s = tn.nodeValue;
    re.lastIndex = 0;
    if (!re.test(s)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(s)) !== null){
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const span = document.createElement('span');
      span.className = 'katex-ignore';
      span.textContent = m[0];
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    frag.appendChild(document.createTextNode(s.slice(last)));
    tn.parentNode.replaceChild(frag, tn);
  });
}
function renderMath(){
  if (!window.renderMathInElement){ ensureKatex().then(ok => { if (ok) renderMath(); }).catch(() => {}); return; }
  try {
    protectInlineMath(preview);
    window.renderMathInElement(preview, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$', right: '$', display: false }
      ],
      ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      ignoredClasses: ['katex-ignore']
    });
  } catch (e) {}
}
let mmdTimer = null;
// 源文本 -> { svg } / { error }：命中即同步注入，避免每次键入都把整篇预览重建、
// 导致所有 Mermaid 图在「原始代码 ↔ SVG」间反复闪烁。只重渲染真正改动过的图。
const mermaidCache = new Map();
function injectMermaidCached(){
  // 同步阶段：把源未变的 mermaid 块直接换回缓存的 SVG（发生在浏览器绘制前，零闪烁）
  const blocks = preview.querySelectorAll('pre code.language-mermaid');
  for (const code of blocks){
    const pre = code.parentNode;
    if (!pre) continue;
    const hit = mermaidCache.get(code.textContent);
    if (!hit) continue;                       // 源变了（正在改这张图）→ 留给 doRenderMermaid 处理
    const div = document.createElement('div');
    div.className = 'mermaid-block' + (hit.error ? ' mermaid-error' : '');
    if (hit.error) div.textContent = 'Mermaid 渲染失败：' + hit.error;
    else div.innerHTML = hit.svg;
    if (pre.getAttribute('data-line')) div.setAttribute('data-line', pre.getAttribute('data-line'));
    if (pre.parentNode) pre.parentNode.replaceChild(div, pre);
  }
}
function renderMermaid(){
  injectMermaidCached();                       // 先同步恢复未变动的图，消除闪烁
  if (mmdTimer) clearTimeout(mmdTimer);
  mmdTimer = setTimeout(doRenderMermaid, 300);
}
async function doRenderMermaid(){
  const blocks = preview.querySelectorAll('pre code.language-mermaid');
  if (!blocks.length) return;
  if (mermaidCache.size > 200) mermaidCache.clear();   // 长会话保护，避免无限增长
  const ok = await ensureMermaid();
  if (!ok) return;
  for (const code of blocks){
    const pre = code.parentNode;
    if (!pre) continue;
    const src = code.textContent;
    const cached = mermaidCache.get(src);
    if (cached){                               // 兜底：理论上 injectMermaidCached 已处理，这里再确认一次
      const div = document.createElement('div');
      div.className = 'mermaid-block' + (cached.error ? ' mermaid-error' : '');
      if (cached.error) div.textContent = 'Mermaid 渲染失败：' + cached.error;
      else div.innerHTML = cached.svg;
      if (pre.getAttribute('data-line')) div.setAttribute('data-line', pre.getAttribute('data-line'));
      if (pre.parentNode) pre.parentNode.replaceChild(div, pre);
      continue;
    }
    const id = 'mmd-' + Math.random().toString(36).slice(2, 8);
    try {
      const res = await window.mermaid.render(id, src);
      const svg = (typeof res === 'string') ? res : res && res.svg;
      if (!svg){ console.error('[Mermaid] 未返回 svg，源:', src); continue; }
      mermaidCache.set(src, { svg });
      const div = document.createElement('div');
      div.className = 'mermaid-block'; div.innerHTML = svg;
      if (pre.getAttribute('data-line')) div.setAttribute('data-line', pre.getAttribute('data-line'));
      if (pre.parentNode) pre.parentNode.replaceChild(div, pre);
    } catch (e) {
      console.error('[Mermaid] 渲染失败:', e);
      const msg = (e && e.message) ? e.message : String(e);
      mermaidCache.set(src, { error: msg });
      const err = document.createElement('div');
      err.className = 'mermaid-block mermaid-error';
      err.textContent = 'Mermaid 渲染失败：' + msg;
      if (pre.parentNode) pre.parentNode.replaceChild(err, pre);
    }
  }
}

// 快捷键
document.addEventListener('keydown', e => {
  if (e.key === 'F3'){
    if (!findBarEl.hidden){ e.preventDefault(); gotoMatch(search.idx + (e.shiftKey ? -1 : 1)); }
    return;
  }
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); saveFile(); }
  else if (k === 'o') { e.preventDefault(); fileInput.click(); }
  else if (k === 'p') { e.preventDefault(); exportPdf(); }
  else if (k === 'f') { e.preventDefault(); openFind(false); }
  else if (k === 'h') { e.preventDefault(); openFind(true); }
});

// 初始化
(function(){
  let theme = 'light';
  try { theme = localStorage.getItem('md-theme') || 'light'; } catch (e) {}
  applyTheme(theme);
  let ptheme = 'github';
  try { ptheme = localStorage.getItem('md-ptheme') || 'github'; } catch (e) {}
  applyPtheme(ptheme);
  syncPthemeToTheme();
  let fsize = 14;
  try { fsize = parseInt(localStorage.getItem('md-font'), 10) || 14; } catch (e) {}
  applyFont(fsize);
  let pwidth = 0;
  try { pwidth = parseInt(localStorage.getItem('md-width'), 10); if (!(pwidth === 0 || (pwidth >= 600 && pwidth <= 1400))) pwidth = 0; } catch (e) {}
  applyWidth(pwidth);
  const sw = $('#selWidth'); if (sw) sw.value = String(pwidth);
  // 恢复布局（分栏 / 仅编辑 / 仅预览）与左右分割比例
  let layout = 'split';
  try { layout = localStorage.getItem('md-layout') || 'split'; } catch (e) {}
  applyLayout(layout);
  let split = '50%';
  try { split = localStorage.getItem('md-split') || '50%'; } catch (e) {}
  const ep = document.querySelector('.editor-pane'); if (ep) ep.style.width = split;
  loadTabs();
  // 注意：空白文档的 content 是空字符串 ''，必须原样保留（不能用 || DEFAULT_MD，否则会被误当成"无内容"而回落成示例文档）
  editor.setValue(activeDoc().content == null ? DEFAULT_MD : activeDoc().content);
  resetEditorImageView();
  renderTabs();
  render();
  tick();                       // 立即同步一次本地时间与周计划「今天」高亮
  setInterval(tick, 60000);     // 每分钟刷新（跨午夜自动滚动「今天」）
})();
</script>
